<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ISM Kakkanad</title>
    <script>
      // Store the current path and redirect to index.html with path info
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Redirect to index.html with the path as a query parameter
      window.location.replace('/index.html?p=' + encodeURIComponent(path) + (search ? '&' + search.slice(1) : '') + hash);
    </script>
  </head>
  <body></body>
</html>
